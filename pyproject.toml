[project]
name = "dynadot-bot"
version = "0.1.0"
description = "Domain registration service via Dynadot (Telegram Bot + TMA + Web)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 90
target-version = "py311"
exclude = ["migrations/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends() in defaults is the documented pattern
    "UP042",   # str+Enum is deliberate: 3.11 compat and Pydantic serialisation
    "RUF001",  # Cyrillic text in RU strings trips the ambiguous-character rule
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The `app` package lives at the repo root, which pytest does not add to
# sys.path on its own (the only conftest.py sits in tests/), so imports like
# `from app.core.config import Settings` need the root injected explicitly.
pythonpath = ["."]
# Pin the fixture loop scope so async fixtures keep function-level isolation
# instead of inheriting pytest-asyncio's future default.
asyncio_default_fixture_loop_scope = "function"
