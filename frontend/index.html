<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + no user scaling: a TMA that pinch-zooms feels
         broken inside the Telegram client. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Домены</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Loaded before our bundle so window.Telegram exists on first render. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
