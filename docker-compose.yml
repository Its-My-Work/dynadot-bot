services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dynadot
      POSTGRES_PASSWORD: dynadot
      POSTGRES_DB: dynadot_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynadot -d dynadot_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dynadot:dynadot@db:5432/dynadot_bot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations before serving so the schema is never behind the code.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
